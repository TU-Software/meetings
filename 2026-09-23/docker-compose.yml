services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"

  migrate:
    build:
      context: ./backend
      dockerfile: migrate.Dockerfile
    environment:
      DATABASE_URL: "postgres://chat:chat@db:5432/chat"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend

volumes: # use volumes for data persistence, remember that writable upper-dir in OverlayFS does not persist if your container is deleted
  db_data:
